name: CI

# รัน typecheck + เทสต์ + build ทุกครั้งที่ push หรือเปิด PR
# ไม่ต้องใช้ secret ใด ๆ (DATABASE_URL/API key) เพราะโค้ดทุกจุดออกแบบให้ build/test ได้แม้ไม่มีค่าพวกนี้ (ดู CLAUDE.md "AI เป็นส่วนเสริม")

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
